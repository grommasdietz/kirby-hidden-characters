---
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      time: '05:00'
      timezone: Europe/Berlin
      day: monday
    groups:
      node-toolchain:
        applies-to: version-updates
        patterns:
          - '*'
      node-toolchain-security:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    rebase-strategy: auto
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      time: '05:00'
      timezone: Europe/Berlin
      day: monday
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      php-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
      php-dependencies-security:
        applies-to: security-updates
        patterns:
          - '*'
    rebase-strategy: auto
  - package-ecosystem: composer
    directory: /playground
    schedule:
      interval: weekly
      time: '05:00'
      timezone: Europe/Berlin
      day: monday
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      php-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
      php-dependencies-security:
        applies-to: security-updates
        patterns:
          - '*'
    rebase-strategy: auto
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
    rebase-strategy: auto
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    rebase-strategy: auto
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      font-tooling-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      font-tooling-security:
        applies-to: security-updates
        patterns:
          - '*'
