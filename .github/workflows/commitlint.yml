name: Commitlint
permissions:
  contents: read
  pull-requests: read
jobs:
  lint:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select verification work
        id: changes
        run: python3 -B .github/scripts/ci-changes.py
      - name: Verify documentation only
        if: steps.changes.outputs.full == 'false'
        run: python3 -B .github/scripts/ci-changes.py docs
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B .github/scripts/dependabot-merge.py title
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
        if: steps.changes.outputs.full == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.full == 'true'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.changes.outputs.full == 'true'
      - name: Lint pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        if: steps.changes.outputs.full == 'true'
    timeout-minutes: 15
    outputs:
      full: ${{ steps.changes.outputs.full }}
      release: ${{ steps.changes.outputs.release }}
      deploy: ${{ steps.changes.outputs.deploy }}
'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
