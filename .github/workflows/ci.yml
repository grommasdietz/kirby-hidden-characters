name: CI/CD Pipeline
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: PHP 8.3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Validate Dependabot schedule types
      run: |
        ruby -ryaml -e '
          config = YAML.safe_load(File.read(".github/dependabot.yml"))
          config.fetch("updates").each_with_index do |update, index|
            schedule = update.fetch("schedule")
            next unless schedule.key?("time")
            time = schedule.fetch("time")
            unless time.is_a?(String) && /\A(?:[01]\d|2[0-3]):[0-5]\d\z/.match?(time)
              abort("updates[#{index}].schedule.time must be a quoted HH:MM string")
            end
          end
          puts "Dependabot schedule times are valid strings."
        '
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: curl, dom, gd, json, mbstring, simplexml
        coverage: none
        tools: composer:v2
    - name: Install playground dependencies
      run: composer install -d playground --prefer-dist --no-progress --no-interaction
    - name: Verify minimum runtime
      run: composer test:smoke
    - name: Install root development dependencies
      run: composer install --prefer-dist --no-progress --no-interaction
    - name: Validate Composer metadata
      run: composer validate --strict --no-check-version
    - name: Check platform requirements
      run: composer check-platform-reqs
    - name: Lint PHP
      run: composer lint
    - name: Static analysis
      run: composer psalm -- --show-info=false --output-format=github --no-cache
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install Node dependencies
      run: pnpm install --frozen-lockfile
    - name: Verify third-party notices
      run: |
        composer notices:generate
        git diff --exit-code -- THIRD_PARTY_NOTICES.md
    - name: Check release readiness
      run: composer release:check
    - name: Run PHPUnit suites
      run: composer test:unit && composer test:integration
    - name: Lint JavaScript
      run: pnpm lint
    - name: Typecheck browser tests
      run: pnpm exec tsc --noEmit
    - name: Verify generated assets
      run: pnpm build:check
    - name: Verify Panel bundle
      run: pnpm test:bundle
    - name: Verify character assets
      run: |
        python3 -m venv "$RUNNER_TEMP/hc-fonts"
        . "$RUNNER_TEMP/hc-fonts/bin/activate"
        python -m pip install -r tools/requirements-fonts.txt
        pnpm test:assets
    - name: Verify source archive
      run: pnpm test:archive
    - name: Verify documentation
      run: pnpm docs:verify
    - name: Check repository hygiene
      run: pnpm test:hygiene
    - run: pnpm exec playwright install --with-deps chromium webkit firefox
    - name: Run browser tests
      env:
        PLAYWRIGHT_CROSS_BROWSER: '1'
      run: pnpm test:browser
    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: kirby-hidden-characters-playwright-artifacts
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 3
  php:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - php-version: '8.2'
          full-suite: false
        - php-version: '8.4'
          full-suite: true
        - php-version: '8.5'
          full-suite: true
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: curl, dom, gd, json, mbstring, simplexml
        coverage: none
        tools: composer:v2
    - name: Install playground dependencies
      run: composer install -d playground --prefer-dist --no-progress --no-interaction
    - name: Verify minimum runtime
      run: composer test:smoke
    - name: Install root development dependencies
      if: matrix.full-suite
      run: composer install --prefer-dist --no-progress --no-interaction
    - name: Run PHPUnit suites
      if: matrix.full-suite
      run: composer test:unit && composer test:integration
    timeout-minutes: 15
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    needs:
    - verify
    - php
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Create release app token
      id: release-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GD_RELEASE_BOT_CLIENT_ID }}
        private-key: ${{ secrets.GD_RELEASE_BOT_PRIVATE_KEY }}
        permission-contents: write
        permission-issues: write
        permission-pull-requests: write
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
        token: ${{ steps.release-token.outputs.token }}
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none
        tools: composer:v2
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - name: Run Semantic Release
      run: pnpm exec semantic-release
      env:
        GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
        HUSKY: 0
    timeout-minutes: 15
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
