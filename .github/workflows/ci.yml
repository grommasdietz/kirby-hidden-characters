name: CI

on:
  push:
    branches: [main, kirby-6]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: grommasdietz/.github/.github/workflows/kirby-plugin.yml@v1
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    with:
      php: '8.3'
      browsers: chromium webkit firefox
      compatibility: '[{"php": "8.4", "kirby": "6.0.0-rc.3", "command": "composer test"}]'
      release: false
    secrets: inherit
