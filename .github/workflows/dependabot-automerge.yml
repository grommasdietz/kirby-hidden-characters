name: 'Dependabot: Auto-merge'

on:
  workflow_run:
    workflows: ['CI/CD Pipeline', 'Dependabot: Metadata']
    types: [completed]

permissions:
  contents: read

jobs:
  automerge:
    name: Merge verified updates after CI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'pull_request_target')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dependabot-merge-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # Write permissions are used only by trusted default-branch tools.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check verified metadata, exact CI commit, and merge policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDABOT_CI_WORKFLOW: .github/workflows/ci.yml
        run: python3 -B .github/scripts/dependabot-merge.py merge
